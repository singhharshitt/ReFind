        <nav class="footer-nav" aria-label="Footer">
            <a href="{% url 'home' %}">Marketplace</a>
            <a href="{% url 'home' %}?kind=exchange">Exchange</a>

            <a href="{% url 'auth' %}?screen=register">Join campus</a>
            {% endif %}
