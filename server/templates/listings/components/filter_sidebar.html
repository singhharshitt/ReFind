<aside class="filters-panel">
    <div class="filters-heading">
        <strong><i data-lucide="list-filter"></i>Filters</strong>
        <a href="{% url 'home' %}" hx-get="{% url 'home' %}" hx-target="#listing-grid">Clear all</a>
    </div>
    <form id="filters-form" method="get">
        <fieldset>
            <legend>Listing Type</legend>
            <label><input type="checkbox" name="kind" value="sale"
                          hx-get="{% url 'home' %}" hx-trigger="change"
                          hx-target="#listing-grid" hx-include="#filters-form"> For Sale (129)</label>
            <label><input type="checkbox" name="kind" value="exchange"
                          hx-get="{% url 'home' %}" hx-trigger="change"
                          hx-target="#listing-grid" hx-include="#filters-form"> For Exchange (34)</label>
            <label><input type="checkbox" name="kind" value="donation"
                          hx-get="{% url 'home' %}" hx-trigger="change"
                          hx-target="#listing-grid" hx-include="#filters-form"> For Donation (20)</label>
        </fieldset>

        <fieldset>
            <legend>Price Range</legend>
            <div class="price-range">
                <div class="range-line"><span></span></div>
                <div class="price-inputs">
                    <input name="min_price" type="number" value="{{ request.GET.min_price|default:'0' }}" aria-label="Minimum price">
                    <input name="max_price" type="number" value="{{ request.GET.max_price|default:'50000' }}" aria-label="Maximum price">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Condition</legend>
            <label><input type="radio" name="condition" value="like-new" {% if request.GET.condition == 'like-new' %}checked{% endif %}> Like New</label>
            <label><input type="radio" name="condition" value="good" {% if request.GET.condition == 'good' %}checked{% endif %}> Good</label>
            <label><input type="radio" name="condition" value="fair" {% if request.GET.condition == 'fair' %}checked{% endif %}> Fair</label>
            <label><input type="radio" name="condition" value="used" {% if request.GET.condition == 'used' %}checked{% endif %}> Used</label>
        </fieldset>
    </form>
</aside>
