<aside class="filters-panel desktop-filters" aria-label="Filter listings">
    <div class="filters-heading">
        <strong><i data-lucide="list-filter"></i> Filters</strong>
        <a href="{% url 'home' %}" class="clear-filters-link"
           hx-get="{% url 'home' %}" hx-target="#listing-grid" hx-push-url="true">
            Clear all
        </a>
    </div>

    <form id="filters-form" method="get" action="{% url 'home' %}">
        {% if request.GET.q %}<input type="hidden" name="q" value="{{ request.GET.q }}">{% endif %}
        {% if request.GET.sort %}<input type="hidden" name="sort" value="{{ request.GET.sort }}">{% endif %}
        {% if request.GET.category %}<input type="hidden" name="category" value="{{ request.GET.category }}">{% endif %}

        <fieldset>
            <legend>Listing Type</legend>
            <label class="filter-label">
                <input type="radio" name="kind" value=""
                       {% if not request.GET.kind %}checked{% endif %}
                       hx-get="{% url 'home' %}" hx-trigger="change"
                       hx-target="#listing-grid" hx-include="#filters-form" hx-push-url="true">
                All types
            </label>
            <label class="filter-label">
                <input type="radio" name="kind" value="sale"
                       {% if request.GET.kind == 'sale' or request.GET.kind == 'sell' %}checked{% endif %}
                       hx-get="{% url 'home' %}" hx-trigger="change"
                       hx-target="#listing-grid" hx-include="#filters-form" hx-push-url="true">
                <span class="filter-dot sell"></span>
                For Sale
                <em class="filter-count">{{ type_counts.sell }}</em>
            </label>
            <label class="filter-label">
                <input type="radio" name="kind" value="exchange"
                       {% if request.GET.kind == 'exchange' %}checked{% endif %}
                       hx-get="{% url 'home' %}" hx-trigger="change"
                       hx-target="#listing-grid" hx-include="#filters-form" hx-push-url="true">
                <span class="filter-dot exchange"></span>
                For Exchange
                <em class="filter-count">{{ type_counts.exchange }}</em>
            </label>
            <label class="filter-label">
                <input type="radio" name="kind" value="donation"
                       {% if request.GET.kind == 'donation' or request.GET.kind == 'donate' %}checked{% endif %}
                       hx-get="{% url 'home' %}" hx-trigger="change"
                       hx-target="#listing-grid" hx-include="#filters-form" hx-push-url="true">
                <span class="filter-dot donate"></span>
                For Donation
                <em class="filter-count">{{ type_counts.donate }}</em>
            </label>
        </fieldset>

        <fieldset>
            <legend>Price Range</legend>
            <div class="price-range-inputs">
                <div class="price-input-wrap">
                    <span>₹</span>
                    <input name="min_price" type="number" min="0" step="100"
                           value="{{ request.GET.min_price|default:'' }}"
                           placeholder="Min"
                           aria-label="Minimum price"
                           hx-get="{% url 'home' %}" hx-trigger="change delay:500ms"
                           hx-target="#listing-grid" hx-include="#filters-form" hx-push-url="true">
                </div>
                <span class="price-sep">–</span>
                <div class="price-input-wrap">
                    <span>₹</span>
                    <input name="max_price" type="number" min="0" step="100"
                           value="{{ request.GET.max_price|default:'' }}"
                           placeholder="Max"
                           aria-label="Maximum price"
                           hx-get="{% url 'home' %}" hx-trigger="change delay:500ms"
                           hx-target="#listing-grid" hx-include="#filters-form" hx-push-url="true">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Condition</legend>
            {% with cond=request.GET.condition %}
            <label class="filter-label">
                <input type="radio" name="condition" value=""
                       {% if not cond %}checked{% endif %}
                       hx-get="{% url 'home' %}" hx-trigger="change"
                       hx-target="#listing-grid" hx-include="#filters-form" hx-push-url="true">
                All conditions
            </label>
            <label class="filter-label">
                <input type="radio" name="condition" value="new"
                       {% if cond == 'new' %}checked{% endif %}
                       hx-get="{% url 'home' %}" hx-trigger="change"
                       hx-target="#listing-grid" hx-include="#filters-form" hx-push-url="true">
                New
            </label>
            <label class="filter-label">
                <input type="radio" name="condition" value="like-new"
                       {% if cond == 'like-new' %}checked{% endif %}
                       hx-get="{% url 'home' %}" hx-trigger="change"
                       hx-target="#listing-grid" hx-include="#filters-form" hx-push-url="true">
                Like New
            </label>
            <label class="filter-label">
                <input type="radio" name="condition" value="good"
                       {% if cond == 'good' %}checked{% endif %}
                       hx-get="{% url 'home' %}" hx-trigger="change"
                       hx-target="#listing-grid" hx-include="#filters-form" hx-push-url="true">
                Good
            </label>
            <label class="filter-label">
                <input type="radio" name="condition" value="fair"
                       {% if cond == 'fair' %}checked{% endif %}
                       hx-get="{% url 'home' %}" hx-trigger="change"
                       hx-target="#listing-grid" hx-include="#filters-form" hx-push-url="true">
                Fair
            </label>
            <label class="filter-label">
                <input type="radio" name="condition" value="used"
                       {% if cond == 'used' %}checked{% endif %}
                       hx-get="{% url 'home' %}" hx-trigger="change"
                       hx-target="#listing-grid" hx-include="#filters-form" hx-push-url="true">
                Used
            </label>
            {% endwith %}
        </fieldset>
    </form>
</aside>
