<header class="site-header">
    <a class="brand" href="{% url 'home' %}" aria-label="ReFind home">
        <span class="brand-mark">
            <svg viewBox="0 0 34 34" aria-hidden="true">
                <path d="M7 27C5 18 9 8 22 5c-1 12-5 19-15 22Z" fill="none" stroke="currentColor" stroke-width="3"/>
                <path d="M12 23c5-7 10-11 17-13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </span>
        <span>ReFind</span>
    </a>
    <span class="marketplace-label">Campus Marketplace</span>
    <nav class="main-nav" aria-label="Main navigation">
        <a class="nav-link active" href="{% url 'home' %}">
            <i data-lucide="home"></i><span>Home</span>
        </a>
        <a class="nav-link" href="#">
            <i data-lucide="layout-grid"></i><span>Listings</span>
        </a>
        <a class="nav-link" href="#">
            <i data-lucide="repeat-2"></i><span>Exchange</span>
        </a>
        <a class="nav-link" href="#">
            <i data-lucide="heart"></i><span>Donate</span>
        </a>
        <a class="nav-link" href="#">

        </a>
    </nav>
    <div class="header-actions">
        <button class="icon-button" type="button" aria-label="Notifications">
            <i data-lucide="bell"></i><span class="notification-dot"></span>
        </button>
        <button class="profile-button" type="button">
            <span class="profile-avatar">S</span>
            <span>Sagar Sahu</span>
