{% extends "listings/layouts/main_layout.html" %}
{% block title %}Check Your Email · ReFind{% endblock %}
{% block content %}
<main class="form-shell" style="max-width:500px;text-align:center;padding-top:60px">
    <div class="auth-envelope" style="margin:0 auto 20px">
        <i data-lucide="mail-check"></i>
    </div>
    <h1>Check Your Inbox</h1>
    <p style="color:#536159">We've emailed you a password reset link. Click it to set a new password.<br>The link expires in 24 hours.</p>
    <a class="btn-primary" href="{% url 'auth' %}?screen=login" style="margin-top:24px;display:inline-flex">Back to Login</a>
</main>
{% endblock %}
