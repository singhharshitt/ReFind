<article class="listing-card">
    <div class="listing-image">
        <img src="{{ listing.image }}" alt="{{ listing.title }}">
        <span class="listing-kind {{ listing.kind }}">{{ listing.kind_label }}</span>
        <button class="favorite-button" type="button" aria-label="Add {{ listing.title }} to wishlist">
            <i data-lucide="heart"></i>
        </button>
    </div>
    <div class="listing-body">
        <h3>{{ listing.title }}</h3>
        <div class="listing-price">
            <strong>{{ listing.price }}</strong>
            {% if listing.old_price %}<del>{{ listing.old_price }}</del>{% endif %}
            <span class="condition {{ listing.condition|lower|slugify }}">{{ listing.condition }}</span>
        </div>
        <div class="seller-row">
            <span class="seller-avatar">{{ listing.seller_initial }}</span>
            <div class="seller-info">
                <strong>{{ listing.seller }}</strong>
                <span><i data-lucide="star"></i>{{ listing.rating }}</span>
            </div>
            <span class="distance"><i data-lucide="map-pin"></i>{{ listing.distance }}</span>
        </div>
    </div>
</article>
