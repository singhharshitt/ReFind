{% extends "listings/layouts/main_layout.html" %}
{% block title %}Password Reset · ReFind{% endblock %}
{% block content %}
<main class="form-shell" style="max-width:500px;text-align:center;padding-top:60px">
    <div class="auth-success-icon" style="margin:0 auto 20px">
        <i data-lucide="check"></i>
    </div>
    <h1>Password Changed!</h1>
    <p style="color:#536159">Your password has been updated. You can now sign in with your new password.</p>
    <a class="btn-primary" href="{% url 'auth' %}?screen=login" style="margin-top:24px;display:inline-flex">
        <i data-lucide="log-in"></i> Sign In
    </a>
</main>
{% endblock %}
