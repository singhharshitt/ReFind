{% extends "listings/layouts/main_layout.html" %}
{% block title %}Reset Password · ReFind{% endblock %}
{% block content %}
<main class="form-shell" style="max-width:500px">
    <div class="page-heading">
        <p class="eyebrow">Account</p>
        <h1>Reset Password</h1>
        <p>Enter your email and we'll send you a reset link.</p>
    </div>
    <form class="listing-form" method="post" novalidate>
        {% csrf_token %}
        <div class="form-field">
            <label for="id_email">Email</label>
            <input id="id_email" name="email" type="email" required placeholder="you@gmail.com" class="rf-input">
        </div>
        <div class="form-submit-row">
            <a class="btn-outline" href="{% url 'auth' %}?screen=login">Back to Login</a>
            <button class="btn-primary" type="submit">
                <i data-lucide="send"></i> Send Reset Link
            </button>
        </div>
    </form>
</main>
{% endblock %}
